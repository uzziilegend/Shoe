<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
</head>
<body>

<section id="admin-panel" style="display:block; margin-top:20px; padding:20px; font-family: sans-serif;">
    <div class="product-input">
        <h2 class="admin-title">Admin Dashboard</h2>
        <input type="file" id="image-file-input" accept="image/*">
        <progress value="0" max="100" id="uploader" style="display:none; width:100%; margin:10px 0;"></progress>
        
        <input type="text" id="product-name" placeholder="Shoe Name" style="width:100%; margin:5px 0; padding:10px;">
        <input type="text" id="product-detail" placeholder="Shoe Details" style="width:100%; margin:5px 0; padding:10px;">
        <div class="price-inputs" style="display:flex; gap:5px;">
            <input type="text" id="product-old-price" placeholder="Old Price" style="flex:1; padding:10px;">
            <input type="text" id="product-price" placeholder="New Price" style="flex:1; padding:10px;">
        </div>
        <select id="product-category" style="width:100%; padding:10px; margin:10px 0;">
            <option value="men">Men Shoes</option>
            <option value="women">Women Shoes</option>
            <option value="children">Children Shoes</option>
        </select>
        <div class="admin-btns">
            <button id="main-btn" class="launch-btn" onclick="handleLaunch()" style="width:100%; padding:15px; background:green; color:white; border:none; font-weight:bold; cursor:pointer; border-radius:5px;">Launch Product</button>
        </div>
    </div>
    <hr style="margin:30px 0;">
    <div class="admin-control-area">
        <h3>Manage Your Posts</h3>
        <div id="admin-post-display"></div>
    </div>
</section>

<script>
    // Password
    const pass = prompt("Enter Admin Password:");
    if (pass !== "uzzi123") {
        alert("Wrong Password!");
        window.location.href = "index.html";
    }

    // Firebase Init
    const firebaseConfig = {
        apiKey: "AIzaSyDJQUk8VOVeGQJfZjgvB0odBswZ1qGKvpw",
        databaseURL: "https://shoeuzair2026-default-rtdb.firebaseio.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Show Posts
    window.onload = function() {
        database.ref('products').on('value', (snapshot) => {
            const display = document.getElementById('admin-post-display');
            display.innerHTML = "";
            snapshot.forEach((child) => {
                const p = child.val();
                display.innerHTML += `
                    <div style="border:1px solid #ddd; padding:10px; margin:10px 0; display:flex; justify-content:space-between; align-items:center; background:#f9f9f9; border-radius:8px;">
                        <img src="${p.img}" width="60" style="border-radius:5px;">
                        <div style="flex:1; margin-left:10px;">
                            <strong>${p.name}</strong><br>
                            <small>Rs. ${p.price}</small>
                        </div>
                        <button onclick="deleteProduct('${child.key}')" style="background:red; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer;">Delete</button>
                    </div>`;
            });
        });
    };

    // FIXED UPLOAD FUNCTION
    async function handleLaunch() {
        const fileInput = document.getElementById('image-file-input');
        const file = fileInput.files[0];
        const name = document.getElementById('product-name').value;
        const price = document.getElementById('product-price').value;
        const uploader = document.getElementById('uploader');

        if (!file || !name || !price) {
            alert("Bhai, Details bharna zaroori hai!");
            return;
        }

        uploader.style.display = "block";
        uploader.value = 10;

        const formData = new FormData();
        formData.append('image', file);

        try {
            // NEW API KEY USED HERE
            const res = await fetch('https://api.imgbb.com/1/upload?key=7076a0d24e6505342a3a5f70007897c6', {
                method: 'POST',
                body: formData
            });
            const result = await res.json();
            
            if (result.success) {
                uploader.value = 70;
                await database.ref('products').push({
                    img: result.data.url,
                    name: name,
                    price: price,
                    oldPrice: document.getElementById('product-old-price').value,
                    detail: document.getElementById('product-detail').value,
                    cat: document.getElementById('product-category').value
                });
                
                uploader.value = 100;
                alert("Mubarak ho! Product Live ho gaya.");
                location.reload();
            } else {
                alert("ImgBB Error: Upload nahi ho saka.");
                uploader.style.display = "none";
            }
        } catch (e) {
            alert("Internet Check Karein!");
            uploader.style.display = "none";
        }
    }

    function deleteProduct(id) {
        if (confirm("Kiya aap waqai delete karna chahte hain?")) {
            database.ref('products/' + id).remove();
        }
    }
</script>

</body>
</html>
